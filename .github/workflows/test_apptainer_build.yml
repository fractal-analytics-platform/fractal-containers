name: Test `apptainer build` in ubuntu24-slurm

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

env:
  IMAGE: apptainer-test

jobs:
  test-apptainer-build:
    timeout-minutes: 30
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build the Docker image ubuntu24-slurm
        run: docker build images/ubuntu24-slurm --tag "$IMAGE"

      # Disable the AppArmor restriction on unprivileged user namespaces (on by
      # default in Ubuntu >= 24.04), so that apptainer can create user
      # namespaces inside the container.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test `apptainer build` as test01
        run: ./images/ubuntu24-slurm/tests/test_apptainer_build.sh "$IMAGE"
